[theme]
base = "light"
primaryColor = "#2563EB"
font = "sans serif"
headingFont = "sans serif"
baseRadius = "medium"
showWidgetBorder = true
chartCategoricalColors = ["#2563EB", "#0F766E", "#D97706", "#7C3AED", "#DC2626"]

[theme.light]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#E1E5EB"

[theme.dark]
backgroundColor = "#111318"
secondaryBackgroundColor = "#1A1D24"
textColor = "#E7EAF0"
borderColor = "#303540"
primaryColor = "#7AA2F7"
